    exemplo_pt: "Cada valor no Rust tem um _dono_."
    evitar:
      - '(?<![^\W_])owners?(?![^\W_])'
    nota: "Como no glossário antigo. “proprietário” só como variação de estilo, nunca “owner”. Comprehensive Rust pt-BR (mensagens com o termo: 4): dono 2, proprietário 1, owner 3."
  - en: "move"
