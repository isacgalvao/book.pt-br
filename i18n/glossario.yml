  - en: "mutable"
    pt: "mutável"
    manter_ingles: false
    classe: adjetivo
    genero: null
    status: provisorio
    exemplo_en: "Access or modify a mutable static variable."
    exemplo_pt: "Acessar ou modificar uma variável estática mutável."
    evitar: []
