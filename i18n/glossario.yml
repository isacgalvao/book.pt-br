    nota: "Fica em inglês, no feminino (“a string”, “uma string”), como no CR (feminino 28: uma 13, a 4, as 4, da 4; nenhum masculino) e na tradução antiga; o mesmo vale para o tipo: “uma `String`”. `String` e `&str` são código. “string literal” → “literal de string”. Comprehensive Rust pt-BR (mensagens com o termo: 45): string 45, cadeia 0."
