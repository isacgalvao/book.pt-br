    manter_ingles: false
    classe: verbo
    genero: null
    status: provisorio
    exemplo_en: "Deep copies of data can take a lot of time."
    exemplo_pt: "Cópias profundas de dados podem levar muito tempo."
    evitar: []
    nota: "Substantivo “copy” → “cópia”; “deep copy” → “cópia profunda”; “shallow copy” → “cópia rasa”. O trait `Copy` é código. Comprehensive Rust pt-BR (mensagens com o termo: 43): cópia/copiar 43."
  - en: "clone"
    pt: "clonar"
    manter_ingles: false
    classe: verbo
    genero: null
    status: provisorio
    exemplo_en: "First, we clone `tx`, creating `tx1` outside the first async block."
    exemplo_pt: "Primeiro, clonamos `tx`, criando `tx1` fora do primeiro bloco assíncrono."
    evitar: []
    nota: "O método `clone` e o trait `Clone` são código. Comprehensive Rust pt-BR (mensagens com o termo: 20): clon- 19."
  - en: "borrowing"
    pt: "empréstimo"
    manter_ingles: false
    classe: substantivo
    genero: m
    status: decidido
    exemplo_en: "Recall the borrowing rules you learned in Chapter 4:"
    exemplo_pt: "Lembre-se das regras de empréstimo que você aprendeu no Capítulo 4:"
    evitar:
      - '(?<![^\W_])borrowing(?![^\W_])'
    nota: "Decisão do mantenedor (CONTRATO §7.1). “borrowing rules” → “regras de empréstimo”. Ver também “borrow” e “borrow checker”. Comprehensive Rust pt-BR (mensagens com o termo: 17): empréstimo 13, borrow 3."
  - en: "borrow"
    pt: "pegar emprestado"
    manter_ingles: false
    classe: verbo
    genero: null
    status: decidido
    exemplo_en: "While references only borrow data, in many cases smart pointers _own_ the data they point to."
    exemplo_pt: "Enquanto as referências só pegam dados emprestados, em muitos casos os ponteiros inteligentes são _donos_ dos dados para os quais apontam."
    evitar:
      - '(?<![^\W_])borrow(?:s|ed)?(?![^\W_])(?!\s+checker)'
    nota: "Decisão do mantenedor (CONTRATO §7.1). “to borrow” → “pegar emprestado” ou “emprestar”, conforme a frase; “borrowed” → “emprestado”; o substantivo (“a borrow”) → “um empréstimo”; “mutable borrow” → “empréstimo mutável”. O método `borrow` e o trait `Borrow` são código. Comprehensive Rust pt-BR (mensagens com o termo: 30): emprest- 18, empréstimo 14, borrow 10."
  - en: "borrow checker"
