# Glossário da tradução pt-BR de “The Rust Programming Language” — versão 2
#
# O QUE É: a terminologia que toda tradução de po/pt-BR.po segue (agentes e pessoas). O
# lotes.py anexa a cada lote as entradas cujo `en` aparece nos msgid do lote; o traduz_delta.py
# envia o mesmo subconjunto ao modelo; o módulo `glossario` do check.py usa o campo `evitar`.
# Em caso de conflito vale: decisões do mantenedor (i18n/CONTRATO.md §7, só a lista “Decided by
# the maintainer”, não os “Provisional defaults of the assistant”) > este glossário >
# i18n/GUIA-DE-ESTILO.md.
#
# QUEM EDITA: SÓ O MANTENEDOR. Agentes nunca editam este arquivo. Quem traduz e precisa de um
# termo que não está aqui usa a melhor opção e o PROPÕE nas notas do lote (“Termo proposto:
# en → pt”); o orquestrador acrescenta cada termo proposto com `status: provisorio`, num commit
# separado, e lista os provisórios para o mantenedor confirmar ou trocar.
#
# ESQUEMA (CONTRATO.md §6):
#   versao: 2
#   termos:                 lista; cada entrada tem todos os campos abaixo
#     en             termo em inglês, em minúsculas; cada `en` aparece uma vez só
#     pt             forma preferida em português; quando o termo fica em inglês, é igual a
#                    `en` (salvo a maiúscula de nome próprio ou sigla: Cargo, API, FFI, ABI)
#                    ou, num verbo inglês que a prosa só usa como substantivo, a forma em
#                    -ing (poll → polling, pin → pinning)
#     manter_ingles  true quando o termo fica em inglês na prosa
#     classe         substantivo | verbo | adjetivo | expressão
#     genero         m | f | null (gênero de `pt`; null em verbos, adjetivos e expressões)
#     status         decidido = decisão explícita do mantenedor (CONTRATO §7, itens 1 e 3);
#                    provisorio = proposta do assistente, vale até o mantenedor confirmar ou
#                    trocar (troca = busca e substituição revisada no PO)
#     exemplo_en     trecho real do livro (copiado de um msgid)
#     exemplo_pt     tradução do trecho conforme este glossário e o guia de estilo
#     evitar         lista de regex Python (pode ser vazia) com as formas que NÃO podem
#                    aparecer na prosa do msgstr
#     nota           uso, variações, gênero e evidência; as contagens do Comprehensive Rust
#                    pt-BR (po/pt-BR.po de google/comprehensive-rust, revisado por humanos)
#                    dizem, entre as mensagens cujo inglês tem o termo, quantas usam cada forma;
#                    as contagens de gênero (“feminino 11: uma 7, ...”) contam o artigo, a
#                    contração ou outro determinante logo antes do termo (singular e plural, com
#                    ou sem ênfase) no msgstr das mensagens de prosa do CR, sem os code spans
#
# COMO O `evitar` É USADO: o módulo `glossario` do check.py aplica cada regex, sem diferenciar
# maiúsculas, ao msgstr das mensagens traduzidas ou fuzzy dos tipos prosa, listing e html,
# depois de remover os code spans, o conteúdo de <code>, <pre> e <kbd>, os destinos de link, a
# parte ][rótulo], as tags HTML e o {#...}. Cada mensagem com casamento vira um aviso por
# termo, que cita as formas achadas (até 3), a contagem e o `pt` preferido (as regras de
# erros-recorrentes.yml rodam no mesmo texto, com a severidade delas). Uma regex sem fronteira
# própria seria envolvida em \b(?:...)\b; todas as daqui já trazem fronteiras explícitas:
#   (?<![^\W_]) ... (?![^\W_])         nenhuma letra ou dígito encostado; o “_” de ênfase pode,
#                                      para pegar “_borrowing_”, que \b deixaria passar;
#   (?<![\w/\\.-]) ... (?![\w/\\]|\.\w)  termos que também são nomes de arquivo ou diretório
#                                      (test, debug, build): não casam com caminhos que a limpeza
#                                      mantém, como “Nome do arquivo: tests/common.rs”,
#                                      _target/debug_, _build.rs_ ou o diretório _tests_.
# As regex de gênero pegam artigo ou pronome do gênero errado antes de um termo mantido em
# inglês (feminino antes de ownership, closure, trait, crate, struct e enum; masculino antes de
# thread, slice, future, macro e string). Ao mudar uma regex, rode-a sobre o msgstr do PO e
# sobre os exemplos.

versao: 2
termos:

  # -------- Ownership, empréstimo e memória
  - en: "ownership"
    pt: "ownership"
    manter_ingles: true
    classe: substantivo
    genero: m
    status: provisorio
    exemplo_en: "Moving Ownership Into an Async Block"
    exemplo_pt: "Movendo o ownership para um bloco assíncrono"
    evitar:
      - '(?<![^\W_])(?:uma|a|à|da|na|pela|numa|desta|dessa|nesta|nessa|esta|essa|aquela|outra|nenhuma|toda|sua|nossa)\s+[_*]*ownership(?![^\W_])'
    nota: "Padrão provisório do assistente (CONTRATO §7), a confirmar com o mantenedor. Fica em inglês, no masculino (“o ownership”). Alternativa em aberto: “posse” (feminino); se o mantenedor escolher “posse”, fazer busca e troca revisada, ajustando o artigo (“o ownership” → “a posse”). “take ownership of” → “assumir o ownership de”; “transfer ownership” → “transferir o ownership”; “give up ownership” → “abrir mão do ownership”; “ownership rules” → “regras de ownership”. Sem glosa entre parênteses. No CR o feminino é mais comum (feminino 8: a 5, à 1, da 1, sua 1) que o masculino (masculino 4: o 4); este glossário adota o masculino, como no CONTRATO §7 (“o ownership”). Comprehensive Rust pt-BR (mensagens com o termo: 24): ownership 18, propriedade 9, posse 2."
