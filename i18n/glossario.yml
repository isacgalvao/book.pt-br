    exemplo_pt: "Passar uma variável para uma função vai movê-la ou copiá-la, assim como acontece na atribuição."
    evitar: []
    nota: "“moved” → “movido”; o substantivo (“Interacting with Move”) → “movimentação”. A palavra-chave `move` dos closures é código. Comprehensive Rust pt-BR (mensagens com o termo: 46): mov- 43, move 2."
  - en: "copy"
