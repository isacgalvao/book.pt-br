    nota: "Fica em inglês, no feminino (“a slice”, “uma slice”, “as slices”), como no CR (feminino 11: uma 7, a 1, as 1, essa 1, nossa 1; masculino 4: o 1, um 1, os 1, do 1). Plural “slices”. “string slice” → “slice de string”. Comprehensive Rust pt-BR (mensagens com o termo: 29): slice 28, fatia 4."
