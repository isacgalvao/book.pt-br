# Erros recorrentes de tradução (pt-BR) — lidos por i18n/tools/checks/glossario.py.
#
# Cada entrada: id (único), regex (Python), severidade (erro | aviso), correcao, explicacao.
# Quem mantém: só o mantenedor (o orquestrador acrescenta as propostas a pedido dele). Agentes,
# tradutores e revisores, só PROPÕEM entradas novas (em `notas`); nunca editam este arquivo.
#
# Como o verificador usa este arquivo:
#   - A regex é aplicada ao msgstr LIMPO (sem code spans, sem o conteúdo de <code>/<pre>/<kbd>,
#     sem destinos de link, sem ][rótulo], sem tags HTML e sem {#...}) das mensagens traduzidas
#     ou fuzzy. Cada regex escolhe sozinha se diferencia maiúsculas, com (?i:...) ou (?-i:...),
#     e dá o mesmo resultado com ou sem re.IGNORECASE. Nenhuma depende de re.MULTILINE.
#   - Defeitos que moram no que a limpeza remove (português dentro de um code span, link sem
#     destino) não têm regex aqui: as regras 2 e 3 de validar_par (mesmo multiconjunto de code
#     spans, mesmos destinos de link) já os recusam como erro.
#   - erro = defeito certo: o check.py (módulo glossario) o marca como erro, o que bloqueia o
#     capítulo (E4) e o CI. O apply.py NÃO lê este arquivo (só aplica validar_par: estrutura),
#     então o tradutor e o revisor precisam conferir antes; o erro só aparece depois de gravado.
#     aviso = suspeita (a forma também tem uso legítimo): um revisor decide.
#   - O `evitar` do glossario.yml e as regras daqui podem coincidir de propósito nos termos
#     decididos: o glossário dá o aviso do termo e este arquivo acrescenta o erro com contexto
#     (`rust-noturno`, `genero-enum`, `genero-struct`, `package-em-ingles`, `fazer-o-build`).
#     Só não se repete aqui a regex idêntica à do `evitar` (nightly “noturno” solto, stable
#     “Rust estável”): essa mora só no glossário.
#   - Código, URLs e comandos ficam fora do texto avaliado.
#
# Para propor uma entrada: escreva a regex, rode-a sobre o msgstr de po/pt-BR.po e sobre prosa
# correta em pt-BR, e só use erro se nenhuma das duas der falso positivo.

erros:
  # ---------------------------------------------------------------- gramática
  - id: futuro-subjuntivo-ver
    regex: '(?i:\b(?:se|quando|caso|enquanto|assim que|sempre que|logo que|depois que)\s+(?:(?:você|vocês|ele|ela|eles|elas|nós|eu|alguém|a gente|o leitor|a pessoa)\s+(?:(?:não|nunca)\s+)?|não\s+)(?:ver|verem|vermos)\b)'
    severidade: erro
    correcao: "se você vir, se vocês virem, se nós virmos; se não vir"
    explicacao: >-
      O futuro do subjuntivo de “ver” é “vir” (se eu vir, se você vir, se nós virmos, se vocês
      virem). “Se você ver”, “se vocês verem” e “se nós vermos” são formas do infinitivo e soam
      erradas. Aparecia 5 vezes no capítulo 1 (“Se você ver essas informações”, “Se não ver essas
      informações”, “Se você não ver essa saída”). Com “caso”, o certo é o presente do
      subjuntivo: caso você veja.

  - id: futuro-subjuntivo-irregular
    regex: '(?i:\b(?:se|quando|caso|enquanto|assim que|sempre que|logo que|depois que)\s+(?:você|vocês|ele|ela|eles|elas|nós|eu|alguém|a gente)\s+(?:(?:não|nunca)\s+)?(?:ter|fazer|dizer|trazer|querer|poder|saber|estar|ser|dar|haver|manter|conter|obter|reter|supor|compor|dispor|expor|impor|propor)(?:em|mos)?\b)'
    severidade: erro
    correcao: "se você tiver, fizer, disser, trouxer, quiser, puder, souber, estiver, for, der, houver, mantiver..."
    explicacao: >-
      Verbos irregulares não usam o infinitivo no futuro do subjuntivo: “se você tiver” (não “se
      você ter”), “quando você fizer” (não “fazer”), “assim que você puder” (não “poder”), “se
      eles tiverem” (não “terem”). Só os verbos regulares (-ar, -er, -ir) coincidem com o
      infinitivo (“se você executar”). Com “caso”, use o presente do subjuntivo: caso você
      tenha, caso você possa.

  - id: concordancia-alguem-eles
    regex: '(?i:\balguém\b(?:[^.!?;:]|\.(?=\S)){0,90}?\b(?:eles|elas)\b)'
    severidade: aviso
    correcao: "essa pessoa, ela"
    explicacao: >-
      “Se você der a alguém um arquivo _.rb_, _.py_ ou _.js_, eles precisam” liga um singular
      (“alguém”) a um plural (capítulo 1). Prefira “essa pessoa” e verbos no singular. O ponto
      de uma extensão de arquivo (“_.rb_”) não encerra a frase para a regex.

  # ----------------------------------------------------------- falsos amigos
  - id: idiomas-rust
    regex: '(?i:\bidiomas?\s+(?:d[oae]s?\s+)?(?:Rust|edição)\b)'
    severidade: erro
    correcao: "expressões idiomáticas do Rust"
    explicacao: >-
      “Idiom” é uma forma típica de escrever em uma linguagem, não um idioma natural. Apareceu
      como “os idiomas da Edição Rust 2024” (página de rosto) e “os idiomas do Rust” (capítulo 0).

  - id: idiomas-ambiguo
    regex: '(?i:\bidiomas?\b(?!\s+(?:d[oae]s?\s+)?(?:Rust|edição)\b))'
    severidade: aviso
    correcao: "expressões idiomáticas (se o original fala de formas típicas de escrever código)"
    explicacao: >-
      “Idiomas” em português são as línguas naturais (“traduzido para vários idiomas”). Se o
      inglês diz “idiom” ou “idiomatic”, o certo é “expressão idiomática” ou “idiomático”. Se o
      inglês diz “languages”, a frase está certa e o aviso pode ser ignorado.

  - id: rust-noturno
    regex: '(?i:\b(?:rust|canal|versão|compilador|toolchain|release|lançamento|recursos?|funcionalidades?)\s+noturn[oa]s?\b)'
    severidade: erro
    correcao: "Rust nightly"
    explicacao: >-
      “Nightly” é o nome do canal de lançamento (aparece assim no `rustup` e no Apêndice G), não
      um adjetivo a traduzir. Apareceu como “o que é o Rust noturno” no capítulo 0. Os canais
      nightly, beta e stable ficam em inglês.

  # ---------------------------------------------------- links e rótulos de link
  - id: atalho-traduzido-sem-definicao
    regex: '\\\[[^\[\]\n]{0,40}[A-Za-zÀ-ÿ]{3,}[^\[\]\n]{0,40}\\\]'
    severidade: erro
    correcao: "[texto traduzido](destino copiado do msgid)"
    explicacao: >-
      Colchetes escapados (\[texto\]) no msgstr mostram que o link perdeu o destino: no PO todo
      link vem na forma inline [texto](destino) e a página mostra os colchetes soltos. Aconteceu
      com “Várias \[traduções\] da comunidade” na página de rosto, que perdeu o link para o
      Apêndice F (correto: [traduções](appendix-06-translation.html)). Traduza só o texto entre
      colchetes e copie o destino do msgid. Esta regex só vê a forma escapada; a forma
      `[traduções]` sem escape e sem destino é recusada como erro pela regra 3 de validar_par
      (mesmos destinos de link).

  - id: filename-em-ingles
    regex: '(?-i:\bFilename:)'
    severidade: erro
    correcao: "Nome do arquivo:"
    explicacao: >-
      O rótulo do `<span class="filename">` e da legenda de listagem é “Nome do arquivo:”. Sobrou
      “Filename:” sem tradução em 3 pontos do capítulo 3 na tradução antiga. Mantenha a tag e o
      nome do arquivo e traduza só o rótulo.

  - id: nome-do-arquivo-forma
    regex: '(?-i:\bNome d[eo] Arquivo\b|\bNome de arquivo\s*:)'
    severidade: aviso
    correcao: "Nome do arquivo:"
    explicacao: "O rótulo é sempre “Nome do arquivo:”, com “do” e “arquivo” em minúscula."

  - id: listing-em-ingles
    regex: '(?-i:\bListings?\s+\d)'
    severidade: erro
    correcao: "Listagem N-M, Listagens N-M"
    explicacao: >-
      Referências a listagens usam “Listagem 2-1”, igual ao rótulo que o build gera, e, no plural,
      “Listagens 10-17 e 10-18” (o livro tem 4 mensagens com “Listings”).

  - id: listagem-formato
    regex: '(?-i:\bListag(?:em|ens)\s+\d+(?:\.|–|—)\d+|\blistag(?:em|ens)\s+\d)'
    severidade: aviso
    correcao: "Listagem 2-1, Listagens 10-17 e 10-18 (maiúscula, hífen comum)"
    explicacao: >-
      O número da listagem é copiado do original com hífen comum e a palavra “Listagem” (ou
      “Listagens”) leva maiúscula, igual ao rótulo gerado pelo build.

  - id: figure-em-ingles
    regex: '(?-i:\bFigure\s+\d)'
    severidade: erro
    correcao: "Figura N-M"
    explicacao: >-
      Referências e legendas de figuras ficam em português, no mesmo molde de “Listagem 3-1”:
      “Figure 4-1” vira “Figura 4-1”. O livro tem 52 ocorrências (capítulos 4, 14, 15, 17 e 21):
      27 referências na prosa e 25 legendas (`<span class="caption">` e `<figcaption>`).

  - id: table-em-ingles
    regex: '(?-i:\bTables?\s+(?:[A-Z]-)?\d)'
    severidade: erro
    correcao: "Tabela N-M, Tabela B-N"
    explicacao: >-
      “Table 3-1” vira “Tabela 3-1” e “Table B-1” vira “Tabela B-1”, como “Listing 3-1” vira
      “Listagem 3-1”. O livro tem 24 mensagens com “Table”: 4 com número de capítulo e 20 do
      Apêndice B (10 legendas e 10 referências na prosa), que levam letra.

  - id: figura-tabela-formato
    regex: '(?-i:\b(?:figuras?|tabelas?)\s+(?:[A-Z]-)?\d|\b(?:Figuras?|Tabelas?)\s+(?:[A-Z]-)?\d+(?:\.|–|—)\d+|\b(?:Figuras?|Tabelas?)\s+[A-Z](?:\.|–|—)\d)'
    severidade: aviso
    correcao: "Figura 4-1, Tabela 3-1, Tabela B-1 (maiúscula, hífen comum)"
    explicacao: >-
      O número vem copiado do original com hífen comum e a palavra leva maiúscula, como em
      “Listagem 2-1”.

  - id: capitulo-em-ingles
    regex: '(?-i:\b(?:Chapter\s+\d+|Appendix\s+[A-Z]\b))'
    severidade: erro
    correcao: "Capítulo N, Apêndice X"
    explicacao: "Referências a capítulos e apêndices ficam em português: “Capítulo 4”, “Apêndice D”."

  - id: capitulo-minusculo
    regex: '(?-i:\bcap[ií]tulos?\s+\d|\bapêndice\s+[A-Z]\b)'
    severidade: aviso
    correcao: "Capítulo 4, Apêndice D"
    explicacao: "Em referência numerada, “Capítulo” e “Apêndice” levam maiúscula, como em “Capítulo 18”."

  - id: note-em-ingles
    regex: '(?-i:\bNote:)'
    severidade: erro
    correcao: "Nota:"
    explicacao: >-
      Notas começam com “Nota:”. O pré-processador do livro roda antes do gettext, então a nota
      mantém o estilo (o número de blocos class="note" é o mesmo em inglês e em português).

  # ----------------------------------------------------------- terminologia (§7)
  - id: genero-enum
    regex: '(?-i:\b(?:[Uu]ma|[Dd]a|[Nn]a|[Pp]ela|[Nn]uma|[Dd]esta|[Dd]essa|[Nn]esta|[Nn]essa|[Ee]sta|[Ee]ssa|[Aa]quela|[Oo]utra|[Nn]enhuma|[Tt]oda|[Àà]|[Aa])\s+\[?[_*]*enum(?![A-Za-zÀ-ÿ0-9])|\b(?:[Aa]s|[Dd]as|[Nn]as|[Pp]elas|[Uu]mas|[Ee]stas|[Ee]ssas|[Oo]utras|[Tt]odas|[Aa]lgumas)\s+\[?[_*]*enums(?![A-Za-zÀ-ÿ0-9]))'
    severidade: erro
    correcao: "o enum, um enum, do enum, no enum, os enums"
    explicacao: >-
      Decisão do mantenedor: enum é masculino (o enum). A tradução antiga dizia “uma enum” (2
      vezes, uma delas “uma [_enum_]”), “da enum” e “outra enum”: 4 pontos do capítulo 2.

  - id: genero-struct
    regex: '(?-i:\b(?:[Uu]ma|[Dd]a|[Nn]a|[Pp]ela|[Nn]uma|[Dd]esta|[Dd]essa|[Nn]esta|[Nn]essa|[Ee]sta|[Ee]ssa|[Aa]quela|[Oo]utra|[Nn]enhuma|[Tt]oda|[Àà]|[Aa])\s+\[?[_*]*struct(?![A-Za-zÀ-ÿ0-9])|\b(?:[Aa]s|[Dd]as|[Nn]as|[Pp]elas|[Uu]mas|[Ee]stas|[Ee]ssas|[Oo]utras|[Tt]odas|[Aa]lgumas)\s+\[?[_*]*structs(?![A-Za-zÀ-ÿ0-9]))'
    severidade: erro
    correcao: "o struct, um struct, do struct, no struct, os structs"
    explicacao: >-
      Decisão do mantenedor: struct é masculino (o struct), igual a enum. O guia antigo dizia “a
      struct”, que não vale mais.

  - id: package-em-ingles
    regex: '(?i:(?<!software )\bpackages?\b)'
    severidade: erro
    correcao: "pacote, pacotes"
    explicacao: >-
      Decisão do mantenedor: package vira pacote. A tradução antiga misturava “um package”,
      “vários packages” e “pacotes”. Exceção real: o nome próprio “Software Package Data
      Exchange” (SPDX), que a regex ignora.

  - id: fazer-o-build
    regex: '(?i:\b(?:faz\w*|fiz\w*|fez|feit[oa]s?|far(?:ei|ás?|emos|ão|ia\w*)|faç\w*)\s+(?:(?:o|os|a|as|um|uns|uma|umas|seu|seus|sua|suas|esse|este|do|de)\s+)?builds?\b)'
    severidade: erro
    correcao: "compilar (o projeto), fazer a compilação"
    explicacao: >-
      Decisão do mantenedor: build (verbo) vira compilar. “Fazer o build” apareceu 12 vezes no
      capítulo 1, até no título “Fazendo o Build e Executando um Projeto Cargo” (correto:
      “Compilando e executando um projeto Cargo”).

  - id: buildar
    regex: '(?i:\bbuild(?:ar|ando|ado|ada|ados|adas|amos|ou)\b)'
    severidade: erro
    correcao: "compilar, compilando, compilado"
    explicacao: "Não aportuguese “build”: o verbo é “compilar”."

  # ----------------------------------------------------------- calques e tom
  - id: mutar
    regex: '(?i:\bmut(?:ar|ando|ad[oa]s?|amos)\b)'
    severidade: aviso
    correcao: "alterar, modificar"
    explicacao: >-
      “Mutar” é calque de “to mutate”. Apareceu em “não temos permissão para mutar o tipo de uma
      variável”. Prefira “alterar” ou “modificar”. “Mutável” e “imutável” continuam certos.

  - id: subotimo
    regex: '(?i:\bsub[óo]tim[oa]s?\b)'
    severidade: aviso
    correcao: "está longe do ideal, não é o melhor"
    explicacao: >-
      “Subótimo” é calque de “suboptimal” (“Isso é subótimo, para dizer o mínimo”). Em
      documentação em português, “está longe do ideal” soa mais natural.

  - id: como-tal
    regex: '(?i:\bcomo tal\b)'
    severidade: aviso
    correcao: "por isso, por esse motivo"
    explicacao: >-
      “Como tal” é calque de “as such” e muda o sentido (“Como tal, muitos Rustaceans executam
      `cargo check` periodicamente”). O sentido era de consequência: “Por isso”. Em frases em
      que “tal” retoma um substantivo, o uso é legítimo; confira.

  - id: tem-sido-uma-de
    regex: '(?i:\b(?:tem sido|têm sido|foi|foram|é|são|era|será)\s+(?:um|uma)\s+de\s+\w+(?:ção|mento|dade|ismo|agem)\b)'
    severidade: aviso
    correcao: "reescrever: tem sido marcada pela colaboração, pelo aprendizado e pela iteração"
    explicacao: >-
      “A jornada do Rust tem sido uma de colaboração” copia o inglês “has been one of
      collaboration”. Em português, reescreva a frase.

  - id: aportuguesamento-de-verbos
    regex: '(?i:\b(?:deploy|push|pull|commit|merge|rebase|fetch|stash|hack|patch)(?:e?ar(?:am|em|ei|ão|á)?|e?ando|e?ad[oa]s?|e?amos|e?ou)\b)'
    severidade: aviso
    correcao: "implantar, enviar, confirmar (commit), mesclar; ou reescreva a frase com o verbo português"
    explicacao: >-
      Não aportuguese verbos ingleses (“deployar”, “pushar”, “commitar”, “mergear”, “hackear”,
      “patchar”): use o verbo português (“implantar”, “enviar”, “confirmar as alterações”,
      “mesclar”). É aviso porque o verbo certo depende do contexto e o glossário pode já ter
      decidido o termo; confira lá. Os verbos que o glossário proíbe um a um (`buildar`, “pinar”,
      “pollar”, “crashar”, “spawnar”, “debugar”) seguem nas entradas deles; só `buildar` também
      está aqui, como erro. Os substantivos (“o commit anterior”, “o patch aplicado”) ficam fora.

  - id: construir-sobre
    regex: '(?i:\bconstr(?:oem|ói|uímos|uiremos|uirá|uirão|uir|uindo|uiu|uíram|uíd[oa]s?|ua|uam)\s+sobre\b)'
    severidade: aviso
    correcao: "partimos disso, com base nisso, se baseiam em"
    explicacao: >-
      “Construímos sobre isso” e “Capítulos posteriores constroem sobre conceitos em capítulos
      anteriores” (capítulo 0, um caso de cada) são calques de “build on that” e “build on
      concepts”. Reescreva: “partimos disso”, “com base nisso”, “Capítulos posteriores se baseiam
      em conceitos de capítulos anteriores”. Construir algo de fato sobre outra coisa é legítimo
      (“construído sobre o TCP”); confira.

  - id: troca-por-trade-off
    regex: '(?i:\btudo é uma troca\b|\beliminar (?:as )?trocas\b|\b(?:fazer|fazemos|faz|fazendo) trocas?\b)'
    severidade: aviso
    correcao: "concessão, concessões (ou “prós e contras”, “compensa”, conforme o glossário)"
    explicacao: >-
      “Trade-off” não é “troca”. “Tudo é uma troca” e “eliminar as trocas” apareceram nos capítulos
      0 e 1. Use “tudo é uma concessão”, “abrir mão de”, “prós e contras” ou “compensar”,
      conforme o glossário.

  - id: calque-onde-brilha
    regex: '(?i:\b(?:é|são)\s+(?:aqui |justamente |exatamente )?onde\b[^.!?;]{0,60}\b(?:realmente )?(?:brilha|se destaca)\b)'
    severidade: aviso
    correcao: "é nisso que o Cargo se destaca"
    explicacao: >-
      “É onde o Cargo realmente se destaca” copia “is where Cargo really shines”. Reescreva em
      português natural.

  - id: raciocinar-transitivo
    regex: '(?i:\bfácil de raciocinar\b|\bfáceis de raciocinar\b)'
    severidade: aviso
    correcao: "mais fácil de entender, mais fácil de analisar"
    explicacao: "“Mais fácil de raciocinar” copia “easier to reason about”."

  - id: codificado-diretamente
    regex: '(?i:\bcodificad[oa]s? diretamente\b)'
    severidade: aviso
    correcao: "valores fixos no código"
    explicacao: >-
      “Hard-coded” não é “codificado diretamente”. Use “valores fixos no código” (sem glosa em
      inglês).

  - id: parenteses-traducao
    regex: '(?i:\((?:aqui,? )?(?:tradução|traduzido como|em português)\b[^)]*\))'
    severidade: aviso
    correcao: "apagar o parêntese; manter só a ênfase do original"
    explicacao: >-
      Padrão provisório (CONTRATO §7, a confirmar com o mantenedor): nada de “(tradução)” depois
      de termo em inglês e nenhum itálico além dos do original. A auditoria descartou a regra
      antiga do “termo em itálico (tradução) na primeira menção”.

  - id: glosa-apos-termo-em-italico
    regex: '(?-i:[_*][A-Za-z][A-Za-z -]{1,30}[_*]\]?\s*\([a-zà-ÿ]{3,25}\))'
    severidade: aviso
    correcao: "apagar a glosa entre parênteses (a ênfase do original já define o termo)"
    explicacao: >-
      “_ownership_ (propriedade)” acrescenta uma glosa que o original não tem. O mesmo vale para
      “é uma _enum_ (enumeração), muitas vezes chamada de _enum_”, que virou tautologia no
      capítulo 2. Traduza o termo ou mantenha-o em inglês, nunca os dois.

  - id: artigo-antes-de-rust
    regex: '(?i:\b(?:dizer|diz|dizem|dizendo|disse|dissemos)\s+(?:a|à)\s+Rust\b)'
    severidade: aviso
    correcao: "dizer ao Rust, dizem ao Rust"
    explicacao: >-
      Padrão provisório (CONTRATO §7, a confirmar com o mantenedor): “o Rust” leva artigo. A
      tradução antiga dizia “dizer a Rust” e, na linha seguinte, “dizem ao Rust”: a mistura é o
      defeito. É aviso (e não erro) porque a regra depende desse padrão ainda não confirmado; se
      o mantenedor o confirmar, suba para erro.

  - id: rust-sem-artigo
    regex: '(?-i:\b(?:[Dd]e|[Ee]m|[Pp]ara|[Cc]om|[Pp]or|[Ss]em|[Ss]obre|[Aa]té)\s+Rust\b(?!\s*(?:\d|Foundation|Playground|Book)))'
    severidade: aviso
    correcao: "do Rust, no Rust, para o Rust, com o Rust"
    explicacao: >-
      Padrão provisório (CONTRATO §7, a confirmar com o mantenedor): “o Rust” leva artigo. Sem
      artigo continua certo quando “Rust” é adjetivo (“código Rust”, “Edição Rust 2024”,
      “Comunidade Rust”), que esta regra não pega. O aviso lista os casos “em Rust”, “de Rust”,
      “sobre Rust” para conferir.

  - id: palavra-repetida
    regex: '(?i:\b([A-Za-zÀ-ÿ]{2,}) \1\b)'
    severidade: aviso
    correcao: "apagar a repetição"
    explicacao: >-
      Palavra repetida em sequência (“você você precisa”, “bem como como”). Só uma ocorrência é
      certa; confira. A regex exige um único espaço entre as duas palavras, para não confundir
      com um code span removido no meio (“para `x` para”).

  - id: tratamento-tu
    regex: '(?i:\b(?:tu|vós|teu|tua|teus|tuas|contigo|convosco)\b)'
    severidade: aviso
    correcao: "você, seu, sua, seus, suas, com você"
    explicacao: "O livro trata o leitor por “você”, nunca por “tu” ou “vós”."

  # --------------------------------------------------------------- tipografia
  - id: aspas-retas
    regex: '"'
    severidade: aviso
    correcao: "“ ” (aspas curvas, como o upstream)"
    explicacao: >-
      O upstream usa aspas curvas “ ” em prosa (nenhuma das 4.602 mensagens traduzíveis tem aspa
      reta fora de código). Aspas retas na tradução vieram de digitação: “seção "Instalação"” na
      página de rosto, programa "Hello, world!" no capítulo 1. Aspas dentro de código não entram
      neste teste.

  - id: maiuscula-apos-dois-pontos
    regex: '(?-i:(?<=[a-zà-ÿ\)\]]): +(?!(?:Rust|Cargo|Ferris|Rustup|Windows|Linux|Unix|Git|GitHub|Option|Result|Some|None|Ok|Err|Box|Vec|String|Rc|Arc|Mutex|Hello|Olá|Apêndice|Capítulo|Listagem)\b)[A-ZÀ-Ý][a-zà-ÿ]+)'
    severidade: aviso
    correcao: "minúscula depois de dois-pontos, salvo nome próprio"
    explicacao: >-
      Em português, depois de dois-pontos vem minúscula (“livro: se você”, “exibe: elas”, “Nota:
      esta edição”), exceto nome próprio, sigla ou citação. Legendas como “Figura 4-1: A
      representação...” não entram no teste (o dois-pontos vem depois de um número). O aviso
      pode pegar nomes próprios que a lista de exceções da regex não conhece; confira.

  - id: titulo-com-todas-maiusculas
    regex: '(?-i:\A(?!A Linguagem de Programação Rust\s*\Z)[A-ZÀ-Ý][\wà-ÿ-]*(?:\s+(?:(?:de|da|do|das|dos|e|em|com|para|no|na|nos|nas|ao|à|a|o|os|as|um|uma|por|sobre)\s+)?[A-ZÀ-Ý][\wà-ÿ-]*){2,}(?:\s+(?:de|da|do|das|dos|e|em|com|para|no|na|a|o|os|as|um|uma|por|sobre))*\s*\Z)'
    severidade: aviso
    correcao: "só a primeira palavra (e nomes próprios) em maiúscula"
    explicacao: >-
      Título em formato de inglês (“Lidando com Falhas Potenciais com Result”). Títulos em pt-BR
      usam maiúscula só na primeira palavra e nos nomes próprios (“Lidando com falhas potenciais
      com `Result`”). Nomes de obra e de organização legítimos aparecem aqui; confira.
